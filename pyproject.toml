[project]
name = "devsync-ai"
version = "0.1.0"
description = "An async AI news aggregator using Gemini, Groq, and Agentic workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=5.0.0",
    "beautifulsoup4>=4.14.2",
    "feedparser>=6.0.12",
    "google-genai>=0.1.0",
    "groq>=0.18.0",
    "markdown>=3.7.0",
    "markdownify>=0.11.6",
    "pandas>=2.2.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.1",
    "pydantic-settings>=2.0.0",
    "alembic>=1.13.0",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.44",
    "streamlit>=1.35.0",
    "trafilatura>=2.3.1",
    "youtube-transcript-api>=1.2.3",
]
[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]